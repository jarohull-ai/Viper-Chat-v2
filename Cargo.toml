[workspace]
members = [
  "crates/viper-core",
  "crates/viper-db",
  "crates/viper-seed",
  "crates/viper-trajectory",
]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
getrandom = "0.4.3"
hmac = { version = "0.13.0", features = ["zeroize"] }
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1.9.1"
yaml_serde = "0.10.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
