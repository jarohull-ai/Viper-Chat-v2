name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify workspace
        run: |
          cargo test --workspace --all-targets
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Require real cross-UID peer-credential test
        run: |
          sudo env "PATH=$PATH" "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" CARGO_TARGET_DIR=target-cross-uid \
            cargo test -p viper-seed \
            ipc::tests::peer_cred_rejects_real_connection_from_another_uid \
            -- --exact --nocapture
          sudo env "PATH=$PATH" "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" CARGO_TARGET_DIR=target-cross-uid \
            VIPER_REQUIRE_CROSS_UID=1 cargo test -p viper-seed \
            ipc_v2::tests::client_rejects_real_v2_provider_with_wrong_uid \
            -- --exact --nocapture
          sudo chown -R "$(id -u):$(id -g)" target-cross-uid
